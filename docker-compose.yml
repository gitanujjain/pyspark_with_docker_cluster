services:

  jupyter:
    image: jupyter
    build:
      context: .
      dockerfile: jupyter.Dockerfile
    container_name: jupyter
    ports:
      - 8889:8888
    volumes:
      - ./data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/spark-events

  
  spark-master:
    container_name: spark-master
    build: .
    image: spark-image
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - ./data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/spark-events
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_WORKLOAD=master  
    env_file:
      - .env.spark
    ports:
      - '9090:8080'
      - '7077:7077'


  spark-worker-1:
    container_name: spark-worker-1
    image: spark-image
    # entrypoint: ["./entrypoint.sh", 'worker']
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_LOCAL_IP=spark-worker-1
      - SPARK_WORKLOAD=worker
    env_file:
      - .env.spark
    volumes:
      - ./data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/spark-events
  
  spark-worker-2:
    container_name: spark-worker-2
    image: spark-image
    # entrypoint: ["./entrypoint.sh", 'worker']
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_LOCAL_IP=spark-worker-2
      - SPARK_WORKLOAD=worker
    env_file:
      - .env.spark
    volumes:
      - ./data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/spark-events
  spark-worker-3:
    container_name: spark-worker-3
    image: spark-image
    # entrypoint: ["./entrypoint.sh", 'worker']
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_LOCAL_IP=spark-worker-3
      - SPARK_WORKLOAD=worker
    env_file:
      - .env.spark
    volumes:
      - ./data:/opt/spark/data
      - ./spark_apps:/opt/spark/apps
      - ./spark-logs:/opt/spark/spark-events
volumes:
  spark-logs: